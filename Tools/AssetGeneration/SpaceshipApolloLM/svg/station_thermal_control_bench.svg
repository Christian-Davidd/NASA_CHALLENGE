<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
  <linearGradient id="kaptonGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fde047"/>
    <stop offset="45%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#b45309"/>
  </linearGradient>
  <linearGradient id="kaptonDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="55%" stop-color="#b45309"/>
    <stop offset="100%" stop-color="#78350f"/>
  </linearGradient>
  <linearGradient id="ascentHull" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#faf6ec"/>
    <stop offset="55%" stop-color="#e3dac7"/>
    <stop offset="100%" stop-color="#b8ad96"/>
  </linearGradient>
  <linearGradient id="inconelDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#47515c"/>
    <stop offset="55%" stop-color="#2e353d"/>
    <stop offset="100%" stop-color="#1b2026"/>
  </linearGradient>
  <linearGradient id="legMetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d4dbe2"/>
    <stop offset="50%" stop-color="#8b949e"/>
    <stop offset="100%" stop-color="#555d66"/>
  </linearGradient>
  <linearGradient id="windowGlass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="40%" stop-color="#0c4a6e"/>
    <stop offset="100%" stop-color="#081c2e"/>
  </linearGradient>
  <linearGradient id="screenDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#071929"/>
    <stop offset="100%" stop-color="#0f314d"/>
  </linearGradient>
</defs>
  
  <ellipse cx="320" cy="560" rx="236" ry="52" fill="#1e293b" opacity="0.28"/>
  <g stroke="#2a221e" stroke-width="8" stroke-linejoin="round">
    <rect x="88" y="88" width="464" height="468" rx="28" fill="url(#legMetal)"/>
    <rect x="110" y="112" width="420" height="420" rx="20" fill="url(#ascentHull)"/>
    <!-- Top Amber/Orange Thermal Header -->
    <rect x="110" y="112" width="420" height="46" rx="14" fill="#ea580c"/>
  </g>
  <text x="320" y="142" font-family="Arial,sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">PLSS THERMAL BENCH</text>

  <!-- Left Bay: Suit LCVG (Liquid Cooling & Ventilation Garment) Torso Loop Rack -->
  <g stroke="#2a221e" stroke-width="6.5" stroke-linejoin="round">
    <rect x="136" y="178" width="176" height="236" rx="16" fill="#1e293b"/>
    <!-- Stylized Suit Torso Mannequin with Blue/Orange LCVG Cooling Tubes -->
    <path d="M184 206 H264 L282 252 L264 388 H184 L166 252 Z" fill="#cbd5e1" stroke-width="5"/>
    <path d="M192 232 Q224 248 256 232 M188 268 Q224 286 260 268 M192 304 Q224 322 256 304 M196 340 Q224 356 252 340"
          fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <path d="M196 250 Q224 266 252 250 M192 286 Q224 304 256 286 M196 322 Q224 340 252 322"
          fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Right Bay: Porous Plate Water Sublimator & Kapton Shielding Upgrader -->
  <g stroke="#2a221e" stroke-width="6.5" stroke-linejoin="round">
    <rect x="328" y="178" width="176" height="114" rx="12" fill="url(#kaptonGold)"/>
    <rect x="346" y="196" width="140" height="78" rx="8" fill="#334155"/>
    <!-- Sublimator Heat Exchanger Fins -->
    <line x1="366" y1="210" x2="366" y2="260" stroke="#38bdf8" stroke-width="6"/>
    <line x1="390" y1="210" x2="390" y2="260" stroke="#38bdf8" stroke-width="6"/>
    <line x1="414" y1="210" x2="414" y2="260" stroke="#f97316" stroke-width="6"/>
    <line x1="438" y1="210" x2="438" y2="260" stroke="#f97316" stroke-width="6"/>
    <line x1="462" y1="210" x2="462" y2="260" stroke="#facc15" stroke-width="6"/>

    <!-- Thermal Level Diagnostic Screen (Nv.1 -> Nv.3) -->
    <rect x="328" y="306" width="176" height="108" rx="12" fill="url(#screenDark)"/>
    <path d="M346 376 L382 342 L416 364 L454 328 L484 344" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <rect x="348" y="386" width="38" height="12" rx="4" fill="#4ade80"/>
    <rect x="396" y="386" width="38" height="12" rx="4" fill="#facc15"/>
    <rect x="444" y="386" width="38" height="12" rx="4" fill="#f97316"/>
  </g>

  <!-- Bottom Coolant Purge & Thermal Calibration Manifold -->
  <g stroke="#2a221e" stroke-width="6.5">
    <rect x="136" y="434" width="368" height="72" rx="12" fill="#334155"/>
    <circle cx="182" cy="470" r="18" fill="#38bdf8"/>
    <circle cx="242" cy="470" r="18" fill="#f97316"/>
    <rect x="288" y="452" width="192" height="36" rx="8" fill="#eab308"/>
    <text x="384" y="476" font-family="Arial,sans-serif" font-weight="900" font-size="16" fill="#1e293b" text-anchor="middle" stroke="none">LCVG / SUBLIMATOR</text>
  </g>

</svg>