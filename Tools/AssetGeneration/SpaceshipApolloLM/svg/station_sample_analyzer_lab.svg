<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
  <linearGradient id="kaptonGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fde047"/>
    <stop offset="45%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#b45309"/>
  </linearGradient>
  <linearGradient id="kaptonDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="55%" stop-color="#b45309"/>
    <stop offset="100%" stop-color="#78350f"/>
  </linearGradient>
  <linearGradient id="ascentHull" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#faf6ec"/>
    <stop offset="55%" stop-color="#e3dac7"/>
    <stop offset="100%" stop-color="#b8ad96"/>
  </linearGradient>
  <linearGradient id="inconelDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#47515c"/>
    <stop offset="55%" stop-color="#2e353d"/>
    <stop offset="100%" stop-color="#1b2026"/>
  </linearGradient>
  <linearGradient id="legMetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d4dbe2"/>
    <stop offset="50%" stop-color="#8b949e"/>
    <stop offset="100%" stop-color="#555d66"/>
  </linearGradient>
  <linearGradient id="windowGlass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="40%" stop-color="#0c4a6e"/>
    <stop offset="100%" stop-color="#081c2e"/>
  </linearGradient>
  <linearGradient id="screenDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#071929"/>
    <stop offset="100%" stop-color="#0f314d"/>
  </linearGradient>
</defs>
  
  <ellipse cx="320" cy="560" rx="236" ry="52" fill="#1e293b" opacity="0.28"/>
  <g stroke="#2a221e" stroke-width="8" stroke-linejoin="round">
    <rect x="84" y="88" width="472" height="468" rx="28" fill="url(#legMetal)"/>
    <rect x="106" y="112" width="428" height="420" rx="20" fill="url(#ascentHull)"/>
    <!-- Top Emerald Science Header -->
    <rect x="106" y="112" width="428" height="46" rx="14" fill="#16a34a"/>
  </g>
  <text x="320" y="142" font-family="Arial,sans-serif" font-weight="900" font-size="21" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">SAMPLE ANALYZER LAB</text>

  <!-- Sealed Bio-Isolation Glovebox Window -->
  <g stroke="#2a221e" stroke-width="7" stroke-linejoin="round">
    <rect x="136" y="176" width="368" height="196" rx="16" fill="url(#windowGlass)"/>
    <!-- Overhead UV/Laser Spectrometer Emitter inside chamber -->
    <rect x="286" y="184" width="68" height="22" rx="6" fill="#94a3b8"/>
    <line x1="320" y1="206" x2="320" y2="278" stroke="#4ade80" stroke-width="5" stroke-dasharray="8 6"/>
    <!-- Martian Regolith & Core Sample sitting on analysis pedestal -->
    <ellipse cx="320" cy="316" rx="62" ry="18" fill="#64748b"/>
    <polygon points="286,310 308,272 346,278 358,312 314,322" fill="#c25934" stroke="#2a221e" stroke-width="5"/>
    <circle cx="326" cy="292" r="7" fill="#4ade80"/>

    <!-- Dual Circular Glove Ports on Front Glass -->
    <circle cx="212" cy="296" r="36" fill="#334155" stroke="#cbd5e1" stroke-width="6"/>
    <circle cx="212" cy="296" r="20" fill="#1e293b"/>
    <circle cx="428" cy="296" r="36" fill="#334155" stroke="#cbd5e1" stroke-width="6"/>
    <circle cx="428" cy="296" r="20" fill="#1e293b"/>
  </g>

  <!-- Lower Sample Tube Carousel Slot (1/1) & Mass Spectrometer Readout -->
  <g stroke="#2a221e" stroke-width="6.5" stroke-linejoin="round">
    <!-- Sample Tube Receiver Port -->
    <rect x="136" y="392" width="142" height="116" rx="12" fill="#475569"/>
    <circle cx="207" cy="450" r="34" fill="#0f172a" stroke="#4ade80" stroke-width="5"/>
    <circle cx="207" cy="450" r="14" fill="#38bdf8"/>

    <!-- Mineralogy Spectrum Monitor -->
    <rect x="296" y="392" width="208" height="116" rx="12" fill="url(#screenDark)"/>
    <rect x="318" y="446" width="18" height="42" rx="3" fill="#4ade80"/>
    <rect x="348" y="420" width="18" height="68" rx="3" fill="#38bdf8"/>
    <rect x="378" y="434" width="18" height="54" rx="3" fill="#facc15"/>
    <rect x="408" y="410" width="18" height="78" rx="3" fill="#4ade80"/>
    <rect x="438" y="452" width="18" height="36" rx="3" fill="#f97316"/>
    <circle cx="478" cy="422" r="8" fill="#4ade80"/>
  </g>

</svg>