<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
  <linearGradient id="kaptonGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fde047"/>
    <stop offset="45%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#b45309"/>
  </linearGradient>
  <linearGradient id="kaptonDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="55%" stop-color="#b45309"/>
    <stop offset="100%" stop-color="#78350f"/>
  </linearGradient>
  <linearGradient id="ascentHull" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#faf6ec"/>
    <stop offset="55%" stop-color="#e3dac7"/>
    <stop offset="100%" stop-color="#b8ad96"/>
  </linearGradient>
  <linearGradient id="inconelDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#47515c"/>
    <stop offset="55%" stop-color="#2e353d"/>
    <stop offset="100%" stop-color="#1b2026"/>
  </linearGradient>
  <linearGradient id="legMetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d4dbe2"/>
    <stop offset="50%" stop-color="#8b949e"/>
    <stop offset="100%" stop-color="#555d66"/>
  </linearGradient>
  <linearGradient id="windowGlass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="40%" stop-color="#0c4a6e"/>
    <stop offset="100%" stop-color="#081c2e"/>
  </linearGradient>
  <linearGradient id="screenDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#071929"/>
    <stop offset="100%" stop-color="#0f314d"/>
  </linearGradient>
</defs>
  
  <ellipse cx="320" cy="560" rx="236" ry="52" fill="#1e293b" opacity="0.28"/>
  <!-- Main Apollo ECS / MOXIE Rack Frame -->
  <g stroke="#2a221e" stroke-width="8" stroke-linejoin="round">
    <rect x="92" y="88" width="456" height="468" rx="28" fill="url(#legMetal)"/>
    <rect x="114" y="112" width="412" height="420" rx="20" fill="url(#ascentHull)"/>
    <!-- Top Cyan O2 Header Bar -->
    <rect x="114" y="112" width="412" height="46" rx="14" fill="#0284c7"/>
  </g>
  <text x="320" y="142" font-family="Arial,sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">MOXIE / ECS O₂</text>

  <!-- Dual Spherical High-Pressure Cryo O2 Tanks (Left) -->
  <g stroke="#2a221e" stroke-width="6.5">
    <circle cx="212" cy="242" r="58" fill="#22c55e"/>
    <path d="M174 218 A42 42 0 0 1 236 202" fill="none" stroke="#bbf7d0" stroke-width="6" stroke-linecap="round"/>
    <rect x="184" y="230" width="56" height="24" rx="5" fill="#f0fdf4" stroke-width="3"/>
    <text x="212" y="248" font-family="Arial,sans-serif" font-weight="900" font-size="16" fill="#14532d" text-anchor="middle" stroke="none">O₂</text>

    <circle cx="212" cy="382" r="58" fill="#06b6d4"/>
    <path d="M174 358 A42 42 0 0 1 236 342" fill="none" stroke="#cffafe" stroke-width="6" stroke-linecap="round"/>
    <rect x="184" y="370" width="56" height="24" rx="5" fill="#ecfeff" stroke-width="3"/>
    <text x="212" y="388" font-family="Arial,sans-serif" font-weight="900" font-size="16" fill="#164e63" text-anchor="middle" stroke="none">O₂</text>
  </g>

  <!-- Gold Kapton Solid Oxide Electrolysis (SOXE) Reactor Core (Right) -->
  <g stroke="#2a221e" stroke-width="6.5" stroke-linejoin="round">
    <rect x="306" y="182" width="188" height="156" rx="14" fill="url(#kaptonGold)"/>
    <line x1="322" y1="216" x2="478" y2="216" stroke="#78350f" stroke-width="5"/>
    <line x1="322" y1="258" x2="478" y2="258" stroke="#78350f" stroke-width="5"/>
    <line x1="322" y1="300" x2="478" y2="300" stroke="#78350f" stroke-width="5"/>
    <!-- Telemetry Readout Screen & Pressure Gauge -->
    <rect x="306" y="356" width="188" height="96" rx="10" fill="url(#screenDark)"/>
    <path d="M322 414 L354 392 L386 420 L422 378 L452 396 L476 382" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="340" cy="434" r="6" fill="#4ade80"/>
    <circle cx="364" cy="434" r="6" fill="#38bdf8"/>
    <circle cx="388" cy="434" r="6" fill="#facc15"/>
  </g>

  <!-- Bottom PLSS Suit Oxygen Umbilical Recharge Hose & Coupler -->
  <g stroke="#2a221e" stroke-width="6.5" stroke-linejoin="round">
    <rect x="148" y="468" width="344" height="44" rx="10" fill="#334155"/>
    <circle cx="196" cy="490" r="13" fill="#38bdf8"/>
    <circle cx="444" cy="490" r="13" fill="#4ade80"/>
    <path d="M226 490 H414" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>

</svg>