<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024">
  <defs>
  <linearGradient id="kaptonGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fde047"/>
    <stop offset="45%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#b45309"/>
  </linearGradient>
  <linearGradient id="kaptonDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="55%" stop-color="#b45309"/>
    <stop offset="100%" stop-color="#78350f"/>
