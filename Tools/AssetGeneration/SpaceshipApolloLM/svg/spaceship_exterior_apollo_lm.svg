    <!-- Rear Right Leg Struts -->
    <line x1="888" y1="620" x2="1068" y2="736" stroke-width="18"/>
    <line x1="888" y1="620" x2="1068" y2="736" stroke="#c09236" stroke-width="9"/>
    <line x1="922" y1="686" x2="1068" y2="736" stroke-width="14"/>
