  <linearGradient id="screenDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#071929"/>
    <stop offset="100%" stop-color="#0f314d"/>
  </linearGradient>
</defs>
  
  <!-- Ground shadow & descent engine blast scorch ring on Martian regolith -->
