    <line x1="358" y1="686" x2="212" y2="736" stroke-width="14"/>
    <line x1="358" y1="686" x2="212" y2="736" stroke="#8b949e" stroke-width="6"/>
    <ellipse cx="206" cy="744" rx="58" ry="24" fill="#596068"/>
