  <rect x="706" y="602" width="88" height="68" rx="6" fill="url(#inconelDark)" stroke="#2a221e" stroke-width="6"/>
  <circle cx="732" cy="636" r="12" fill="#f59e0b" stroke="#2a221e" stroke-width="4"/>
  <circle cx="766" cy="636" r="12" fill="#38bdf8" stroke="#2a221e" stroke-width="4"/>

