<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 768 384">
  <defs>
  <linearGradient id="plasmaCore" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#f0abfc"/>
    <stop offset="28%" stop-color="#d946ef"/>
    <stop offset="68%" stop-color="#7e22ce"/>
    <stop offset="100%" stop-color="#2e1065"/>
  </linearGradient>
  <linearGradient id="plasmaDeep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a855f7"/>
    <stop offset="55%" stop-color="#6b21a8"/>
    <stop offset="100%" stop-color="#1e0b36"/>
  </linearGradient>
  <linearGradient id="cloudMassGrad" x1="0.2" y1="1" x2="0.6" y2="0">
    <stop offset="0%" stop-color="#24084a"/>
    <stop offset="38%" stop-color="#6b21a8"/>
    <stop offset="76%" stop-color="#c026d3"/>
    <stop offset="100%" stop-color="#f5d0fe"/>
  </linearGradient>
  <radialGradient id="billowGlow" cx="45%" cy="24%" r="72%">
    <stop offset="0%" stop-color="#fdf4ff" stop-opacity="0.92"/>
    <stop offset="32%" stop-color="#e879f9" stop-opacity="0.78"/>
    <stop offset="68%" stop-color="#7e22ce" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="mistBlob" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#d946ef" stop-opacity="0.46"/>
    <stop offset="48%" stop-color="#7e22ce" stop-opacity="0.26"/>
    <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
  </radialGradient>
  <filter id="neonAura" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="cloudBloom" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
</defs>
  
  <g filter="url(#neonAura)">
    <!-- Main sweeping plasma wave crest -->
    <path d="M36 312 C145 304, 210 218, 278 134 C338 58, 434 52, 472 118 C436 96, 390 124, 398 176 C408 214, 456 220, 508 182 C558 144, 608 136, 646 184 C612 164, 576 186, 586 226 C598 268, 668 292, 728 312 Z"
          fill="url(#plasmaCore)" stroke="#3b0764" stroke-width="7" stroke-linejoin="round"/>
    <!-- Inner fluid swirling ribbon highlights -->
    <path d="M98 296 C192 276, 258 190, 318 128 C362 82, 422 76, 450 108" fill="none" stroke="#fae8ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M180 302 C264 280, 326 238, 398 238 C462 238, 526 204, 592 172" fill="none" stroke="#f0abfc" stroke-width="6" stroke-linecap="round" opacity="0.88"/>
    <path d="M44 312 L728 312" stroke="#f5d0fe" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
  </g>
  <!-- Plasma crest droplets and ion bursts -->
